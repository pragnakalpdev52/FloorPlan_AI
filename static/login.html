<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · FloorPlan AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css?v=13" />
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-card {
      width: min(380px, 100%);
    }
    .login-brand {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 18px;
    }
    .login-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }
    .login-field label {
      font-size: 13px;
      color: var(--muted);
    }
    .login-field input {
      background: rgba(8, 17, 28, 0.5);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text);
      font: inherit;
    }
    .login-field input:focus {
      outline: 1px solid var(--accent);
    }
    .login-submit {
      width: 100%;
      margin-top: 4px;
    }
    .login-error {
      color: #ef8a8a;
      font-size: 13px;
      margin: 0 0 12px;
      min-height: 1em;
    }
    .login-demo-hint {
      margin-top: 16px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      color: var(--muted);
      background: rgba(61, 190, 165, 0.08);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
    }
  </style>
</head>
<body>
  <div class="login-page">
    <form class="panel login-card" id="login-form">
      <div class="login-brand">
        <span class="brand-mark">FP</span>
        <div>
          <strong>FloorPlan AI</strong>
          <div class="panel-copy">Sign in to continue</div>
        </div>
      </div>

      <p class="login-error" id="login-error"></p>

      <div class="login-field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus />
      </div>

      <div class="login-field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>

      <button class="primary-btn login-submit" type="submit">Sign in</button>

      <p class="login-demo-hint">Demo login: demo / demo@9558</p>
    </form>
  </div>

  <script>
    const form = document.getElementById("login-form");
    const errorEl = document.getElementById("login-error");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorEl.textContent = "";
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      const submitBtn = form.querySelector("button[type=submit]");
      submitBtn.disabled = true;
      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });
        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          errorEl.textContent = data.detail || "Invalid username or password.";
          return;
        }
        window.location.href = "/";
      } catch (error) {
        errorEl.textContent = "Could not reach the server. Please try again.";
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
